# Relais NetScan sur Cloudflare Workers.
# Déployer : npm run relais:deploy
# Secrets (à taper soi-même, jamais dans ce fichier) :
#   npx wrangler secret put ANTHROPIC_API_KEY --config relais/wrangler.toml
#   npx wrangler secret put CODE_ACCES --config relais/wrangler.toml
name = "netscan-relais"
main = "worker.js"
compatibility_date = "2026-09-01"

# 5 demandes par minute et par appareil.
[[ratelimits]]
name = "LIMITE"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 5
  period = 60

[vars]
NETSCAN_MODEL = "claude-opus-5-5"
NETSCAN_EFFORT = "medium"
